# Edge proxy: the single public entrypoint (the Cloudflare tunnel points at
# http://edge:80). TLS ends at Cloudflare. Replaces the Caddy edge (2026-10-26):
# same routes, built and scanned by CI, config in git.
#
# Upstreams resolve per request through Docker's DNS, so the edge starts (and
# keeps serving the other routes) while any one service is down or restarting.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Redirects carry just the path (Location: /beta/). Behind the tunnel nginx
    # sees plain HTTP, so an absolute redirect would point browsers at http://.
    absolute_redirect off;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # The edge's own liveness, for its HEALTHCHECK and CI's smoke test.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Routing requests can wait on GraphHopper (30 s timeout in the backend).
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 60s;
    }

    # The staging UI. The prefix is stripped, so the beta container serves its
    # assets from root while the browser asks for them under /beta/.
    location = /beta {
        return 301 /beta/;
    }
    location /beta/ {
        set $beta http://frontend-beta:80;
        rewrite ^/beta/(.*)$ /$1 break;
        proxy_pass $beta;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }
}
