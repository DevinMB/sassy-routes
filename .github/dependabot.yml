version: 2
updates:
  # Patch and minor updates arrive as one PR per ecosystem; majors stay
  # separate and wait for Devin.
  - package-ecosystem: pip
    directories: [/backend, /pipeline]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      updates:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      updates:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /pipeline]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      updates:
        update-types: [minor, patch]
    ignore:
      # nginx odd minors are the mainline branch; the frontend tracks stable (even).
      - dependency-name: nginx
        update-types: [version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    groups:
      updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "DevinMB/workflows/*"
