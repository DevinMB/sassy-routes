name: sassy-routes

services:
  # LOCAL DEVELOPMENT. Production runs from DevinMB/homelab-stacks
  # (sites/home/sassy-routes), deployed by stack-sync on the sassy-routes VM.
  #
  # Edge reverse proxy, the single public entrypoint (nginx; config in
  # infra/edge/nginx.conf, baked into the image).
  edge:
    build: ./infra/edge
    restart: unless-stopped
    ports:
      - "8080:80"
    # The Cloudflare tunnel's public hostname targets http://caddy:80 (set in the
    # Cloudflare dashboard); the alias keeps that working without touching it.
    networks:
      default:
        aliases: [caddy]
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped

  # Staging UI at /beta — same source tree, same API. Rebuild it alone with
  # `make beta` to try design changes against real routes; production keeps
  # serving the last image built by `make up` until you promote.
  frontend-beta:
    build:
      context: ./frontend
      args:
        VITE_BASE: /beta/
    restart: unless-stopped

  backend:
    # Built from the repo root: the image's test stage needs scoring.yaml.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APEX_GRAPHHOPPER_URL: http://graphhopper:8989
      APEX_ALLOWED_ORIGINS: ${APEX_ALLOWED_ORIGINS:-http://localhost:8080}
      APEX_MAX_ROUTE_DISTANCE_KM: ${APEX_MAX_ROUTE_DISTANCE_KM:-500}
      APEX_COUCHDB_URL: http://${COUCHDB_USER:-apex}:${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}@couchdb:5984
    volumes:
      - ./scoring.yaml:/srv/scoring.yaml:ro
    depends_on:
      - graphhopper
      - couchdb

  # First start imports the OSM extract into a graph (~5-15 min for Michigan,
  # watch `docker compose logs -f graphhopper`). Subsequent starts load the
  # cached graph from ./data/graph-cache in seconds. After replacing the
  # extract, run `make clean-graph` to force a reimport.
  graphhopper:
    image: israelhikingmap/graphhopper:9.1
    restart: unless-stopped
    # -o is required: the image's entrypoint derives its own graph location
    # (/data/default-gh, inside the image's anonymous /data volume) unless told
    # otherwise — it overrides graph.location from the config file.
    command: ["-c", "/gh-config/config.yml", "-i", "/data/osm/michigan-latest.osm.pbf", "-o", "/data/graph-cache"]
    environment:
      JAVA_OPTS: "-Xmx${GH_JAVA_XMX:-4g} -Xms1g"
    volumes:
      - ./infra/graphhopper/config.yml:/gh-config/config.yml:ro
      - ./data/osm:/data/osm:ro
      - ./data/graph-cache:/data/graph-cache
      - ./data/elevation:/data/elevation-cache
    ports:
      # localhost-only, for poking the GH API / web UI directly while debugging
      - "127.0.0.1:8989:8989"

  # Not consumed by the backend until Phase 1 (segment scores + route cache),
  # but part of the stack from day one so volumes/creds are settled early.
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-apex}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    volumes:
      - ./data/couchdb:/opt/couchdb/data
    ports:
      # localhost-only, for Fauxton admin UI at http://127.0.0.1:5984/_utils
      - "127.0.0.1:5984:5984"

  # Offline segment scorer (Phase 1). Not part of `up` — run on demand:
  #   make pipeline    (full Michigan run: ~10-30 min, rebuilds `segments` db)
  pipeline:
    # Built from the repo root: the image's test stage needs scoring.yaml.
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    profiles: ["pipeline"]
    environment:
      APEX_COUCHDB_URL: http://${COUCHDB_USER:-apex}:${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}@couchdb:5984
      APEX_SCORING_PATH: /srv/scoring.yaml
      APEX_OSM_PBF: /data/osm/michigan-latest.osm.pbf
      APEX_SRTM_CACHE: /data/srtm
    volumes:
      - ./scoring.yaml:/srv/scoring.yaml:ro
      - ./data/osm:/data/osm:ro
      - ./data/srtm:/data/srtm
      - ./data/scores:/data/scores
    depends_on:
      - couchdb

  # One-shot graph import with the apex_fun encoded value baked in from the
  # pipeline's CSV (the stock graphhopper image can LOAD such a graph but not
  # build one). Run via `make import-graph` after `make pipeline`.
  #
  # It builds into ./data/graph-staging, mounted here at the container path the
  # config expects — so the LIVE graph keeps serving traffic for the whole
  # ~10 min import and `make import-graph` swaps it in at the end. A failed
  # import therefore never touches the running graph.
  gh-import:
    build: ./infra/gh-import
    profiles: ["import"]
    environment:
      JAVA_OPTS: "-Xmx${GH_JAVA_XMX:-3g} -Xms1g"
    command: ["/gh-config/config.yml", "/data/scores/apex-fun.csv"]
    volumes:
      - ./infra/graphhopper/config.yml:/gh-config/config.yml:ro
      - ./data/osm:/data/osm:ro
      - ./data/graph-staging:/data/graph-cache
      - ./data/elevation:/data/elevation-cache
      - ./data/scores:/data/scores:ro

  # Cloudflare tunnel — exposes the stack at https://sassyroutes.devinbutts.net.
  # Opt-in via the "tunnel" profile so it never runs during local dev:
  #   make tunnel                     (starts the whole stack incl. the tunnel)
  # or set COMPOSE_PROFILES=tunnel in .env to include it in a plain `make up`.
  #
  # One-time Cloudflare setup (Zero Trust → Networks → Tunnels):
  #   1. Create a tunnel; copy its token into TUNNEL_TOKEN in .env.
  #   2. Add a Public Hostname: sassyroutes.devinbutts.net → service
  #      http://caddy:80, an alias of the edge service (HTTP, not HTTPS — Cloudflare terminates TLS and the
  #      tunnel reaches Caddy over the internal docker network).
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    # Not required with `:?` here: compose evaluates interpolation for ALL
    # services even when this one is excluded by profile, which would break a
    # plain `make up`. `make tunnel` guards the token instead.
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - edge

  # Kafka is deferred to Phase 3 (offline pipeline + apex.events analytics).
  # Guardrail: it must never sit in the user-facing routing path.
