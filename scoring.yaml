# Fun-scoring model config — the single home for every weight and threshold
# (guardrail 5: no magic numbers in code). Version-controlled so model changes
# are reviewable. Consumed by:
#   - /pipeline (offline segment scoring into CouchDB)
#   - /backend  (per-lambda GraphHopper custom models, candidate shaping)
# Values are provisional; tune with real drives.
# (version feeds route-cache keys: bump it whenever weights change so stale
# cached candidates aren't served)
version: 8

# ---------------------------------------------------------------------------
# Offline segment scoring (pipeline → CouchDB `segments`)
# fun_index = blend(curvature, elevation, road_class) × surface_gate × safety_gate
# ---------------------------------------------------------------------------

curvature:
  # Practical ceiling. The raw score is "what fraction of this way is
  # sweeper-grade curvy", and almost nothing approaches 1.0 — measured
  # statewide p90=0.40, p95=0.50, p99=0.66. Left raw, even an excellent road
  # scored ~0.4, so the 60%-weighted curvature term was swamped by road_class
  # (which saturates near 1.0 on any rural road): curvature was contributing
  # just 3.8% of a real route's score while road_class contributed 76%.
  # Treating 0.45 as "maximally curvy" makes corners actually lead the blend.
  full_score_fraction: 0.45
  # Interior vertices are binned by angular change per 100 m of local length.
  # Each bin contributes weight × local length; score = Σ / total length.
  bins:
    straight: { max_deg_per_100m: 5,    weight: 0.0 }
    gentle:   { max_deg_per_100m: 15,   weight: 0.2 }
    sweeper:  { max_deg_per_100m: 45,   weight: 1.0 }
    tight:    { max_deg_per_100m: 90,   weight: 0.9 }
    hairpin:  { max_deg_per_100m: .inf, weight: 0.4 }

conflict_points:
  # Vertices within this distance (along the way) of a junction node have their
  # curvature discounted — a curve at a blind driveway/intersection is a
  # hazard, not fun (roadcurvature.com insight).
  radius_m: 30
  # Discount rather than erase. A hard zero was structurally unfair: OSM splits
  # ways AT junctions, so both ends of every way sit in the conflict zone and
  # short ways lost ALL their curvature (measured: 57% of routable ways scored
  # exactly zero; at 0.25 that drops to 34%, while ways scoring ≥0.30 only rise
  # 15.9%→18.2% — it rescues real curvy roads without inflating the rest).
  near_junction_weight: 0.25

elevation:
  # Relief (total |Δelevation| per km) earns up to 1.0 at full_score_m_per_km.
  # Calibrated against measured Michigan relief (p50=13, p75=21, p90=32,
  # p95=41 m/km): the old bar of 15 put 41.7% of ways at the ceiling, making
  # elevation a near-constant instead of a signal. At 40 only 5.5% max out and
  # the median road lands near 0.33, so this actually discriminates.
  relief_full_score_m_per_km: 40
  # Sustained steep grade (> grade_pct over > length_m) caps the component.
  sustained_steep: { grade_pct: 9, length_m: 500, component_cap: 0.3 }
  # Grades are clipped to ±max_grade_pct before stats (SRTM noise guard).
  max_grade_pct: 30

road_class:
  # Component score per OSM highway value (links inherit their parent).
  tertiary: 1.0
  unclassified: 0.9
  secondary: 0.85
  primary: 0.45
  trunk: 0.1
  motorway: 0.0
  # Residential streets default to heavily discouraged (driveways, stop
  # signs, blind corners — guardrail 4). BUT a residential way that's both
  # slow (posted/implied ≤ this limit) and low-access-density (few
  # driveways/junctions per km, same idea as the safety gate below) reads as
  # a genuine open curvy street rather than a subdivision maze, and is scored
  # like a minor through-road instead. The tight-curve-at-low-limit safety
  # gate still applies on top of this — a promoted residential way can still
  # get penalized back down if its geometry is a goat path.
  residential: 0.05
  residential_open: 0.75
  # A way with an endpoint no other way touches is a dead end — a cul-de-sac,
  # driveway or stub. You can't drive *through* it, so it is never a fun road,
  # and this override beats every promotion above. Without it the model ranked
  # subdivision courts as the best roads in Michigan: a dead-end bulb has zero
  # interior junctions (so it dodged the access-density gate), qualified for
  # residential_open, and its tight curve maxed out curvature. Measured: 8 of
  # the top 12 "best roads" near Grand Rapids were courts and drives.
  dead_end: 0.02
  residential_open_max_speed_kmh: 41      # 25 mph == 40.23 km/h; give it headroom
  residential_open_max_junction_density_per_km: 8
  living_street: 0.0
  service: 0.0
  road: 0.3

  # Multiplicative veto, applied like the surface and safety gates below.
  #
  # The scores above are *blend components* carrying only `blend.road_class`
  # (0.25) of the total, so setting one to 0.0 subtracts at most a quarter of
  # the score — it reads like an exclusion but is really a haircut. That is not
  # enough to keep a parking lot out: aisle geometry is nothing but tight 90°
  # corners, so it saturates the 0.60-weighted curvature term and a service way
  # still scores up to 0.60 + 0.15 = 0.755. Measured before this gate existed:
  # 219,383 of the 278,965 ways in the seek index (79%) were `service`, 64,047
  # of them at or above 0.60 — GraphHopper's top, entirely *unpenalised* tier.
  # A real route out of Grand Rapids drove 2,554 m of parking lot, dipping off
  # the road and back four times (the reported "goes through a company's
  # parking lot").
  #
  # `dead_end` has the same story. It is documented above as an override that
  # "beats every promotion", and as a component it cannot be: at 0.02 it scores
  # a service way *higher* than `service: 0.0` does, which is why the very top
  # of the index was dead-end driveways at exactly 0.755.
  #
  # These belong here rather than in the blend because they aren't a matter of
  # degree — a parking aisle is not a road you drive for pleasure however good
  # its geometry, so it has to be able to lose on class alone. Values put a
  # maximally-curvy example below `seek.min_fun_index` (0.40) and inside the
  # `not_fun` routing tier (< 0.15): 0.755 × 0.05 = 0.038.
  # Ways not listed are ungated (1.0).
  gate:
    service: 0.05
    living_street: 0.10
    # Applied to any way with an endpoint no other way touches, whatever its
    # class — you cannot drive *through* a cul-de-sac, so it is never a road
    # worth going out of your way for. Note this also catches ways clipped by
    # the edge of the OSM extract, which look dead-ended because their
    # continuation isn't in the file; at Michigan's borders that is acceptable.
    dead_end: 0.10

surface:
  # Multiplicative gate. Low sports car (Miata ND): unpaved kills the score.
  unpaved_values: [gravel, fine_gravel, unpaved, compacted, dirt, ground,
                   earth, grass, sand, mud, pebblestone, wood, cobblestone,
                   unhewn_cobblestone, woodchips]
  unpaved_multiplier: 0.02
  # No surface tag: mostly fine on classified rural roads, slight discount.
  unknown_multiplier: 0.9

safety:
  # Multiplicative gate — dangerous geometry must score DOWN (guardrail 4).
  # Dense access points (junctions+driveways) near curves = blind-driveway risk.
  # Density counts INTERIOR junctions only: OSM splits ways at intersections,
  # so every way ends at a junction by construction and counting the endpoints
  # roughly tripled apparent density (measured median 12/km vs 3.4/km interior
  # -only), firing this gate on 67% of ways instead of a targeted 28%.
  junction_density_per_km_threshold: 8
  dense_access_multiplier: 0.5
  # Tight/hairpin-heavy geometry on low-limit roads: goat-path penalty.
  low_speed_limit_kmh: 45
  tight_fraction_threshold: 0.35
  low_limit_tight_multiplier: 0.5

blend:
  # Weights over component scores (should sum to 1).
  curvature: 0.60
  elevation: 0.15
  road_class: 0.25

runtime:
  # Fun index assumed for route intervals whose way has no CouchDB doc
  # (unscored/missing) when length-weighting a route's fun index.
  default_fun_index: 0.25

# ---------------------------------------------------------------------------
# Online routing (backend → GraphHopper custom models)
# ---------------------------------------------------------------------------

gh_custom_model:
  # Per-lambda priority penalties. Effective factor at fun dial λ is
  #   1 - λ·(1 - factor)   (λ=0 → 1.0 / no effect; λ=1 → factor).
  # Factors must stay ≤ 1 (penalize boring, never reward) — required for
  # landmark-search admissibility and by guardrail 4.
  # Tiers over the apex_fun encoded value — the pipeline's own fun index,
  # baked into the graph by `make import-graph`. The dial literally routes on
  # the score the UI displays. (GH's built-in curvature EV proved too blunt:
  # sweeper roads quantize to "straight" — measured, see repo history.)
  #
  # Steeper than the first cut: the original tiers only distinguished "bad"
  # from "not bad" — anything ≥0.40 was unpenalized, so GraphHopper had no
  # reason to prefer a great 0.7 road over a merely OK 0.41 one, and measured
  # detours barely moved (+0.3-1.7 min on real East Grand Rapids test routes).
  # This version keeps the gradient climbing all the way to the top tier
  # (≥0.60, the ceiling — priority multipliers must stay ≤1, guardrail 4), so
  # a short really-good segment is worth detouring for, not just avoiding bad
  # ones.
  priority:
    - name: not_fun
      condition: "apex_fun < 0.15"
      factor: 0.15
    - name: barely_fun
      condition: "apex_fun < 0.30"
      factor: 0.35
    - name: moderately_fun
      condition: "apex_fun < 0.45"
      factor: 0.60
    - name: decent_fun
      condition: "apex_fun < 0.60"
      factor: 0.85
  # Lambda-independent hard penalties (applied whenever λ > 0).
  always:
    - name: unpaved_no_thanks    # Miata rule
      condition: "surface == GRAVEL || surface == FINE_GRAVEL || surface == UNPAVED || surface == COMPACTED || surface == DIRT || surface == GROUND || surface == GRASS || surface == SAND || surface == COBBLESTONE || surface == WOOD || surface == OTHER"
      factor: 0.10
    # Parking aisles, drive-thrus and business-park service lanes. The tiers
    # above read `apex_fun` and nothing else, so before this rule a service way
    # baked in at 0.67 sat in the top tier and was routed through in preference
    # to an ordinary road — the router had no concept of road class at all.
    # Measured on the reported route: 2,554 m of service road became 45 m, and
    # the route got 4.9 min *faster* in the process.
    #
    # This duplicates the offline `road_class.gate` on purpose. The gate fixes
    # the stored score but only reaches the router through `apex_fun`, which is
    # baked into the graph at import time; this rule reads GraphHopper's own
    # `road_class` encoded value and so also covers ways the pipeline never
    # scored, and takes effect on a backend restart rather than a re-import.
    #
    # A penalty, not a ban: reaching a destination inside a business park or a
    # mall still needs its access road, and at 0.05 the router will take one
    # when there is genuinely no alternative (the 45 m above is the final
    # driveway) while never choosing one for fun.
    - name: not_a_road_you_drive
      condition: "road_class == SERVICE || road_class == LIVING_STREET"
      factor: 0.05

routing:
  # Fun dial values for the candidate routes (fastest λ=0 is always computed).
  candidate_lambdas: [0.3, 0.6, 0.9]
  # Wander budget: candidates slower than this × fastest are dropped.
  # (Still a cap — never a 3-hour detour for a 20-minute errand.)
  max_time_multiplier: 3.0
  # Candidates within these tolerances of an already-kept route are dropped.
  dedupe: { time_s: 30, distance_m: 200 }

seek:
  # Peak-seeking: deliberately route through short, genuinely great roads that
  # a length-weighted average would otherwise ignore. (Measured motivation: a
  # 0.567-scoring curve on Hall St SW is 261 m of a 39-mile trip — routing
  # through it moves the route average by ~0.001, so plain weighting will
  # never chase it, but a driver absolutely wants it.)
  #
  # Only segments at or above this score are indexed as seek targets — keeps
  # the CouchDB view small and the search fast.
  min_fun_index: 0.40
  # Seeking means "go out of your way to drive this road", and a subdivision
  # street is never that however good its geometry — it's 25 mph past people's
  # front yards. Measured case: Regal Drive scores 0.938 with curvature AND
  # elevation both maxed and no gate firing (few driveways, sweeping bends
  # rather than tight ones), so nothing in the geometry criteria can catch it.
  # These roads stay fully scored and routable — a curvy residential street
  # that's genuinely on your way is still preferred — they just aren't hunted
  # as destinations.
  exclude_highways: [residential, living_street, service]
  # Grid cell for the coordinate index, degrees (~2.2 km at Michigan latitudes).
  cell_size_deg: 0.02
  # How far off the straight origin→destination line to look, km.
  corridor_buffer_km: 6
  # Don't detour for a sliver. Set just under the length of a real find (the
  # 261 m Hall St SW curve) — below this the index fills with 100-200 m bends
  # on urban arterials that aren't worth leaving your route for.
  min_length_m: 250
  # Seek targets to try routing through (each costs one routing call).
  max_targets: 3
  # Hard ceiling: drop the seek candidate if it costs more than this multiple
  # of the fastest route's time, however good the road.
  max_time_multiplier: 2.5

  # --- ranking -------------------------------------------------------------
  # Which targets are worth *trying*, best first. Ranking on fun alone made a
  # short gem far off the corridor beat a long great road right on it.
  # value = fun × min(length, length_cap) ÷ (1 + off_corridor_km / half_km)
  # Beyond length_cap extra metres stop multiplying (one enormous road
  # shouldn't crowd out everything else); at half_km off the line a target is
  # worth half as much.
  length_cap_m: 3000
  corridor_half_km: 6.0

  # A detour has to be EARNED by the road, not merely fit under the ceiling.
  # Allowed extra time ≈ this × km of road × its fun index.
  detour_minutes_per_km: 30
  # ...but never less than this, however short the road. The per-km term alone
  # underserves exactly the roads seek exists for: a 900 m gem at 0.93 earns
  # only ~17 min on length, while the owner's stated preference is that "a
  # longer, roundabout way to a destination beats a boring direct one — worth
  # +20 to 30 minutes." That preference is an absolute number of minutes, not
  # a multiple of trip length, so it belongs here as a floor.
  # Supersedes the older calibration that capped this near 10 min: that was
  # tuned before out-and-back spurs were fixed, when a "detour" often bought
  # re-driving the same road rather than new road.
  detour_floor_minutes: 25
  # Charged against the budget above for road driven twice (see overlap.py).
  # Pinning both ends of the sought road removes ordinary out-and-backs at
  # source, so this is the backstop for what geometry can't prevent — mainly
  # genuine dead ends. Deliberately a penalty, not a ban: a spectacular
  # dead-end road can still outbid it. Start high enough that ordinary spurs
  # vanish (1 km re-driven costs 30 min, more than any road earns) and tune
  # down if a road you'd actually double back for gets rejected.
  retraversal_penalty_minutes_per_km: 30

  # ...plus a flat charge for doubling back AT ALL, whatever the distance.
  #
  # The per-km rate alone cannot price the defect that actually reached a user.
  # Pinning a road's endpoints makes GraphHopper touch that exact point, so
  # when the natural approach joins the road *inside* the tip it drives past
  # and turns around — 122 m of overshoot ending in a 175° reversal. At the
  # rate above that is 3.7 min against a 25 min budget: waved straight through,
  # while being the most obviously-broken thing on the map. There is no
  # engine-side fix to lean on either, since GraphHopper 9.0 silently ignores
  # `pass_through` (see graphhopper.py).
  #
  # Set above `detour_floor_minutes` minus a typical detour so a road earning
  # only the floor cannot keep a double-back, while a long, great road (a 3 km
  # road at 0.9 earns 81 min) can still outbid it — the same "weight, not ban"
  # stance as the rate above. Measured separation is wide and needs no fine
  # tuning: every route showing the defect re-drove 122-4701 m, while every
  # good seek candidate across seven test routes re-drove exactly 0 m.
  retraversal_fixed_minutes: 20
  # Below this, treat a repeat as shared geometry at a junction rather than
  # doubling back, and charge nothing. Well under the 122 m real defect.
  retraversal_ignore_m: 25

drive:
  # "Take me for a drive": a randomized fun loop for a time budget.
  # Distance ↔ time. Fun loops run slower than highways; tune by real drives.
  avg_speed_kmh: 60
  # Per-leg aim radius = target distance × this. In practice a loop through two
  # fun clusters runs ~4.4 straight-line legs, not 3 (roads wander), so measured
  # loops came out ~20% long at 0.30 — 0.23 lands them near the requested time.
  radius_fraction: 0.23
  # Aim points get ±this fraction of jitter on their radius.
  radius_jitter: 0.20
  # Angular gap between the two aim points, degrees (makes a loop, not there-
  # and-back). Randomized in this range.
  bearing_separation_deg: [45, 120]
  # An aim point snaps to a high-fun cluster within this distance, or is skipped.
  snap_max_km: 10
  # Accept a loop whose time lands within this fraction of the request.
  time_tolerance: 0.30
  # Weight on road driven twice when picking among the attempted loops. Aim
  # points snap to fun-cluster centroids rather than to road ends, so a leg can
  # arrive and leave the same way — measured at 5-7.6% of every loop generated.
  # Scored alongside the time error (not as a filter), so a loop that doubles
  # back loses to an equally-timed one that doesn't, and a slightly-off-time
  # clean loop wins. Lower than seek's rate: a loop returning home past a good
  # road it already drove is far less objectionable than an A→B route doing it.
  retraversal_penalty_minutes_per_km: 12
  # Random bearings to try before giving up (each = a couple of routing calls).
  max_attempts: 8
  # Clamp the requested duration (minutes) — anti-DoS and keeps loops sane.
  min_duration_min: 15
  max_duration_min: 240

cache:
  route_ttl_seconds: 86400
  # Origin/destination snapped to a grid cell for cache keys (~550 m).
  cell_size_deg: 0.005

# ---------------------------------------------------------------------------
# Google Maps handoff (Phase 2)
# ---------------------------------------------------------------------------

handoff:
  # Practical cap on intermediate waypoints in a Maps deep link (CLAUDE-ref §5).
  max_waypoints: 9
  # A chain gap whose route path exceeds its straight chord by more than this
  # gets a waypoint at the detour apex — excess length is what Google's
  # fastest-route preference would shortcut (smooth curve sag is harmless and
  # deliberately NOT counted). Remaining excess above this ⇒ not "pinned":
  # warn and offer GPX instead of silently emitting a link Google reroutes.
  max_gap_excess_m: 400
  # After compression picks which detours to pin, each waypoint is slid to the
  # cleanest spot on its road so Google snaps it without looping/U-turning:
  # clearance from the nearest junction, minus this × the vertex's turn angle
  # (so straight spots win). At 4, a 30° bend costs 120 m of clearance-equiv —
  # strongly prefers straight, mid-detour points over sharp apexes at junctions.
  waypoint_curve_penalty_m_per_deg: 4
  # A waypoint is kept within this fraction of the detour's half-length from its
  # centre (so the pin holds), and within that band prefers a vertex at least
  # this far from any mid-detour junction (so Google snaps without looping).
  waypoint_center_window_frac: 0.35
  waypoint_junction_clearance_m: 40
  # Verified mode only (APEX_HANDOFF_VERIFY): Google's returned overview
  # polyline is coarser than our geometry, so its threshold is looser.
  verify_max_deviation_m: 250
  verify_max_attempts: 3
